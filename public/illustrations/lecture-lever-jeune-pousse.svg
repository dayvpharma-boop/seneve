<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E2"/>
      <stop offset="100%" stop-color="#F5EBD0"/>
    </linearGradient>
  </defs>
  <!-- Background sky -->
  <rect width="400" height="220" rx="16" fill="url(#skyGrad)"/>
  
  <!-- Subtle sunrise sun circle -->
  <circle cx="200" cy="115" r="46" fill="#E6C875" opacity="0.45"/>
  <circle cx="200" cy="115" r="28" fill="#D4AF37" opacity="0.35"/>
  
  <!-- Back distant soft hill -->
  <path d="M-20 185 Q 90 120 220 155 T 420 140 L 420 220 L -20 220 Z" fill="#E2D4B7" opacity="0.65"/>
  
  <!-- Mid hill -->
  <path d="M-10 170 Q 120 145 280 180 T 420 170 L 420 220 L -10 220 Z" fill="#D3C3A2" opacity="0.85"/>
  
  <!-- Front ground hill -->
  <path d="M-10 195 Q 160 175 410 190 L 410 220 L -10 220 Z" fill="#C2B08B"/>
  
  <!-- Center Sapling / Jeune pousse épurée -->
  <!-- Stem -->
  <path d="M 200 185 Q 199 155 200 135" stroke="#3D321F" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Left leaf -->
  <path d="M 200 150 C 185 145 178 135 182 125 C 192 125 198 138 200 150 Z" fill="#586845"/>
  <!-- Right leaf -->
  <path d="M 200 142 C 214 136 220 124 216 116 C 206 117 201 130 200 142 Z" fill="#6B7E55"/>
  <!-- Tiny top sprout bud -->
  <circle cx="200" cy="133" r="3" fill="#849964"/>
  
  <!-- Subtle ground speckles -->
  <circle cx="188" cy="189" r="1.5" fill="#3D321F" opacity="0.4"/>
  <circle cx="214" cy="191" r="1.5" fill="#3D321F" opacity="0.4"/>
</svg>