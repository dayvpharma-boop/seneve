name: Audit des dépendances npm
on:
  push:
    branches: [main, 'securite/2026-11-23-dependances-tests']
    paths: ['package.json', 'package-lock.json', '.github/workflows/audit-outils.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=low
