name: Construire les applications mobiles de test
on:
  workflow_dispatch:
  push:
    branches: [main, feat/rappels-locaux-20261028]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'src/**'
      - 'package*.json'
      - '*config.ts'
      - '.github/workflows/mobile.yml'
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run src/test/rappels-locaux.test.ts src/test/rappels-locaux-ui.test.tsx
      - run: npm run build:mobile
      - run: npx cap sync android
      - name: Construire l’APK de test
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon
      - name: Autoriser l’accélération de l’émulateur éphémère
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Vérifier deux redémarrages réels sans réseau
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/mobile/cold-start-offline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preuve-demarrage-android
          path: build/cold-start/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: seneve-android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:mobile
      - run: npx cap sync ios
      - name: Construire pour le simulateur iPhone sans signature de distribution
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Préparer l’application du simulateur
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app build/seneve-ios-simulateur.zip
      - uses: actions/upload-artifact@v4
        with:
          name: seneve-ios-simulateur
          path: build/seneve-ios-simulateur.zip
          if-no-files-found: error
          retention-days: 30

