name: Vérifier et mettre en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer
        run: npm install --no-audit --no-fund
      - name: Contrôles automatiques
        run: npm test
      - name: Construire le site
        # Habitudes & Défis : écrans actifs pour les inscrits ; inscription publique fermée jusqu'à décision.
        env:
          VITE_HABITUDES_DEFIS: 'true'
          VITE_HABITUDES_INSCRIPTION: fermee
        run: npm run build
      - name: Charger la version HD de test validée
        uses: actions/checkout@v4
        with:
          ref: be1dc0ee593c9de38fbb3dd97bfe05702f6b5d84
          path: _recette-hd
      - name: Installer la recette HD
        working-directory: _recette-hd
        run: npm install --no-audit --no-fund
      - name: Vérifier la connexion et la préinscription HD
        working-directory: _recette-hd
        run: npx vitest run --config scripts/recette/vite-habitudes.config.ts src/test/habitudes-catalogue.test.tsx src/test/habitudes-retour-connexion.test.tsx src/test/connexion.test.tsx src/test/habitudes-acces-recette.test.tsx src/test/habitudes-planning.test.ts src/test/habitudes-jour-recette.test.tsx src/test/habitudes-jour-recette-api.test.ts src/test/habitudes-declaration.test.tsx src/test/habitudes-historique-recette.test.tsx src/test/habitudes-bilans.test.tsx
      - name: Construire la recette isolée seneve-test
        working-directory: _recette-hd
        env:
          VITE_SUPABASE_URL: https://rlojnuaajeubzlwofwhn.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_hKtQydTHS9enjNTXkK8eTA_1LJkDcPh
        run: node scripts/recette/habitudes-build-test.mjs
      - name: Joindre la recette au site
        run: |
          mkdir -p dist/recette-hd
          cp -R _recette-hd/dist-recette-hd/. dist/recette-hd/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
