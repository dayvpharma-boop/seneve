</button>

</div>

<script>
  (function() {
    const retryBtn = document.getElementById('retry-btn');
    const retryLabel = document.getElementById('retry-label');
    const retrySpinner = document.getElementById('retry-spinner');

    if (retryBtn) {
      retryBtn.addEventListener('click', function() {
        retryLabel.textContent = 'Connexion en cours...';
        retrySpinner.classList.remove('hidden');
        retryBtn.disabled = true;
        retryBtn.classList.add('opacity-90');

        setTimeout(function() {
          retryLabel.textContent = 'Réessayer';
          retrySpinner.classList.add('hidden');
          retryBtn.disabled = false;
          retryBtn.classList.remove('opacity-90');
        }, 1200);
      });
    }
  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-low/95 backdrop-blur-xl shadow-[0_-1px_12px_rgba(29,28,19,0.03)]" data-active-classes="text-primary font-semibold"><div class="flex justify-around items-center h-16 px-gutter"><a class="flex flex-col items-center justify-center gap-1 min-w-[56px] min-h-[44px] text-on-surface-variant transition-colors hover:text-primary" data-path="aujourdhui" href="#"><span class="material-symbols-outlined text-[22px]">calendar_today</span><span class="font-label-nav text-label-nav">Aujourd'hui</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[56px] min-h-[44px] text-on-surface-variant transition-colors hover:text-primary" data-path="journal" href="#"><span class="material-symbols-outlined text-[22px]">edit_note</span><span class="font-label-nav text-label-nav">Journal</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-1 min-w-[56px] min-h-[44px] transition-colors text-primary font-semibold" data-path="coach" href="#"><span class="material-symbols-outlined text-[22px]">psychology</span><span class="font-label-nav text-label-nav">Coach</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[56px] min-h-[44px] text-on-surface-variant transition-colors hover:text-primary" data-path="progres" href="#"><span class="material-symbols-outlined text-[22px]">trending_up</span><span class="font-label-nav text-label-nav">Progrès</span></a><a class="flex flex-col items-center justify-center gap-1 min-w-[56px] min-h-[44px] text-on-surface-variant transition-colors hover:text-primary" data-path="profil" href="#"><span class="material-symbols-outlined text-[22px]">person</span><span class="font-label-nav text-label-nav">Profil</span></a></div></nav></body></html>
