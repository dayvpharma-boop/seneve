nner:'Demo · fictional data · no account or payment',kicker:'Habits & Challenges',heading:'One small step, every day.',intro:'Plan your day, practise at your own pace and start again with confidence.',access:'Planned journey: six months · first month free · five paid months',today:'My today',settings:'My schedule',dateLabel:'Demonstration day',meaning:'This summary shows declared activities. It measures neither your faith nor your worth.',prayerTitle:'Pray with the complete Amidah',prayerInfo:'The full prayer is planned for morning, midday and evening. Its text, languages and audio will be offered after approval. No substitute text is shown here.',otherTitle:'The rest of the journey',otherInfo:'Seven-root challenges, reviews, private commitments and a tithe simulator are also part of this module. They are still being prepared; this demo collects no amounts or intimate accounts.',prefTitle:'A day that fits your life',prefIntro:'Change the suggested times in this demo. Each habit stays separate and its recorded completion is preserved.',zoneLabel:'Suggested time zone',church:'Church times are examples: Wednesday, Friday and Sunday. Choosing your congregation’s days will be added during integration.',apply:'Apply to the demo',reset:'Restore suggested times',footer:'Working prototype · changes remain only in this open page · no reminders are sent',states:['Not started','Prepared','Partly completed','Completed'],actions:['Prepare','Partly done','I completed it'],help:'Ask for help',helpState:'Help requested in the demo',applied:'Schedule applied to the demo. Nothing was sent to a server.',done:(n,t)=>n+' of '+t+' activities completed',minutes:(a,b)=>a===b?a+' minutes':a+' to '+b+' minutes',days:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']}};

const officialChallenges=[{"day": 1, "text": "Commence ta journée avec 15 minutes de silence avant ton téléphone. Lis Matthieu 6:25-34.", "page": 156}, {"day": 2, "text": "Identifie une décision que tu dois prendre cette semaine. Prie spécifiquement dessus avant d'agir.", "page": 156}, {"day": 3, "text": "Passe ta soirée sans écran. Lis la Parole, prie, dors en paix.", "page": 156}, {"day": 4, "text": "Écris dans un carnet tout ce pour quoi tu es reconnaissant aujourd'hui. Minimum 10 choses.", "page": 156}, {"day": 5, "text": "Passe 30 minutes à prier pour des personnes autres que toi — famille, collègues, voisins.", "page": 156}, {"day": 6, "text": "Relis Luc 16:10-13. Médite sur ce que signifie la fidélité dans les petites choses pour toi.", "page": 156}, {"day": 7, "text": "Jour de repos. Déconnecte-toi des affaires. Recharge-toi dans la présence de Dieu.", "page": 157}, {"day": 8, "text": "Calcule exactement ta dîme du mois en cours. Mets-la de côté aujourd'hui.", "page": 157}, {"day": 9, "text": "Écris tous tes revenus et toutes tes dépenses du mois dernier. Regarde où va ton argent sans te juger.", "page": 157}, {"day": 10, "text": "Identifie une dépense inutile que tu peux supprimer ce mois-ci.", "page": 157}, {"day": 11, "text": "Donne quelque chose de concret à quelqu'un dans le besoin — sans le dire à personne.", "page": 157}, {"day": 12, "text": "Relis Malachie 3:10-12. Prie sur la promesse divine de protection financière.", "page": 157}, {"day": 13, "text": "Fixe un montant d'épargne mensuelle — même symbolique. Commence aujourd'hui.", "page": 157}, {"day": 14, "text": "Prie sur tes finances. Nomme tes dettes devant Dieu. Demande Sa direction pour un plan de remboursement.", "page": 157}, {"day": 15, "text": "Commence ta journée de travail par une prière de 5 minutes. Demande l'intégrité et l'excellence.", "page": 158}, {"day": 16, "text": "Identifie une pratique professionnelle à corriger. Prends la décision de la changer.", "page": 158}, {"day": 17, "text": "Rends visite à une veuve, un orphelin ou une personne seule dans ton entourage.", "page": 158}, {"day": 18, "text": "Appelle ou visite quelqu'un que tu as négligé. Prends des nouvelles sincèrement.", "page": 158}, {"day": 19, "text": "Examine tes amitiés proches. Qui te tire vers le haut spirituellement ? Prie pour renforcer ces relations.", "page": 158}, {"day": 20, "text": "Accomplis une tâche ordinaire avec une excellence inhabituelle — comme si Dieu l'observait directement.", "page": 158}, {"day": 21, "text": "Jour de jeûne et prière. Consacre ce jour à chercher la direction de Dieu pour ta vie.", "page": 158}, {"day": 22, "text": "Face à une décision en cours : applique le test de la paix. Ne décide pas si la paix est absente.", "page": 158}, {"day": 23, "text": "Lis Proverbes 3:5-6. Médite sur ce que signifie ne pas s'appuyer sur ta propre intelligence.", "page": 158}, {"day": 24, "text": "Parle à un croyant mûr de confiance d'une décision difficile. Écoute son conseil.", "page": 159}, {"day": 25, "text": "Passe ta journée en posant la question intérieure : « Seigneur, est-ce Ta direction ? » avant chaque acte.", "page": 159}, {"day": 26, "text": "Identifie une porte que Dieu a fermée dans ta vie récente. Remercie-Le pour cette protection.", "page": 159}, {"day": 27, "text": "Identifie une porte que Dieu a ouverte dans ta vie récente. Remercie-Le pour cette faveur.", "page": 159}, {"day": 28, "text": "Lis Jean 16:13. Prie pour une sensibilité accrue à la voix du Saint-Esprit.", "page": 159}, {"day": 29, "text": "Relis tous les engagements écrits que tu as signés à la fin de chaque chapitre.", "page": 159}, {"day": 30, "text": "Écris une lettre à Dieu — pas une prière formelle, mais une conversation honnête sur ce que ces 30 jours t'ont appris et ce que tu t'engages à poursuivre. Termine-la par le geste de Bartimée : nomme le « manteau de mendiant » que tu jettes définitivement aujourd'hui.", "page": 159}];

const activityContent={"fr": {"wake": ["Commence à l’heure que tu as choisie. Prends un moment pour regarder les rendez-vous de ta journée et adapte-les si ton travail ou ta santé le demande.", "Confirme lorsque tu es levé. Une heure différente ne supprime pas ta progression."], "gratitude_am": ["Nomme un ou plusieurs motifs de reconnaissance : une personne, une aide reçue ou une possibilité qui s’ouvre aujourd’hui. Tu peux les exprimer intérieurement ou avec tes propres mots.", "Confirme après avoir exprimé ta gratitude. Écrire dans le journal reste facultatif."], "prayer_am": ["Prends le temps de prier le matin. L’Amidah intégrale est le texte prévu par défaut. Elle n’est pas encore reproduite dans cette version : la source complète et sa présentation doivent être vérifiées. Tu peux aussi prier avec tes propres mots.", "Déclare « J’ai réalisé » après avoir effectivement prié ; ouvrir une page ou écouter un audio ne suffit pas."], "bible_am": ["Lis un passage biblique et prends le temps de le comprendre. Pour le premier jour de l’annexe 1 du livre, le passage indiqué est Matthieu 6:25-34. Demande-toi quelle action concrète tu peux en retenir pour ta journée.", "Confirme après ta lecture. Si tu n’as lu qu’une partie de ce que tu avais prévu, choisis « En partie »."], "exercise": ["Prévois 10 à 15 minutes de gymnastique douce ou d’activité adaptée à tes capacités. Choisis des mouvements qui te conviennent et adapte la durée si nécessaire. Cette consigne ne remplace pas tes indications de santé personnelles.", "Indique ce que tu as réellement fait. Une adaptation n’est pas un échec et aucune performance n’est exigée."], "professional": ["Consacre 30 minutes à une lecture utile à ton métier, tes études ou ton activité. Choisis un document pertinent. Tu peux retenir une idée à essayer dans ton prochain travail.", "Confirme le temps de lecture effectivement réalisé ; utilise « En partie » si tu n’as pas terminé."], "prayer_noon": ["À midi, réserve un moment à la prière selon ton horaire personnel. L’Amidah complète est prévue ici aussi ; sa version autorisée reste à intégrer. Tu peux prier avec tes propres mots.", "Confirme cette prière séparément de celle du matin et de celle du soir."], "sermon": ["Prévois 30 minutes pour écouter une prédication que tu as choisie. Écoute avec attention et prends le temps de réfléchir à son enseignement. Aucune prédication n’est présentée comme recommandation officielle dans cette démonstration.", "Confirme seulement ce que tu as écouté. Lancer un fichier ne valide pas cette activité."], "reading": ["Consacre 30 minutes à un livre de développement personnel choisi avec discernement. Tu peux retenir une idée utile et réfléchir à la manière de la mettre en pratique. Aucun titre supplémentaire n’est imposé ici.", "Déclare ta lecture réelle ; tu peux indiquer une réalisation partielle."], "bible_pm": ["Relis la Bible le soir, selon le passage choisi ou le contenu du parcours lorsqu’il sera publié. Prends un moment pour comprendre le texte et réfléchir à ta journée, sans te comparer aux autres.", "Confirme après ta lecture du soir. Cette activité reste distincte de la lecture du matin."], "gratitude_pm": ["Repense à ta journée et exprime ta reconnaissance pour un ou plusieurs éléments concrets. Tu peux aussi reconnaître une difficulté sans te forcer à la présenter comme une réussite.", "Confirme après ce moment de gratitude. Aucun récit personnel n’est demandé."], "prayer_pm": ["Réserve un moment à la prière du soir. L’Amidah complète est prévue comme texte par défaut après vérification de sa source et de sa présentation. Tu peux aussi prier avec tes propres mots.", "Confirme après avoir prié. Ce rendez-vous a sa propre réalisation."], "sleep": ["Organise ta soirée autour de l’heure de coucher que tu as choisie. Adapte cet horaire à tes responsabilités et à tes besoins personnels. Le suivi repose sur ta déclaration, sans surveillance du sommeil.", "Confirme lorsque tu t’es couché ; tu peux revenir le lendemain sur la date concernée dans la démonstration."], "church_we": ["Ce créneau du mercredi est une proposition. Utilise les horaires réels de ton assemblée. L’objectif du module est trois participations hebdomadaires, avec des adaptations à prévoir selon la situation.", "Confirme après ta participation. En cas d’impossibilité, garde une déclaration honnête et reprends sans remise à zéro."], "church_fr": ["Ce créneau du vendredi est une proposition à remplacer par celui de ton assemblée. Prépare ta disponibilité et participe selon les possibilités de ta situation.", "Confirme une participation réelle. Une invitation reçue ne vaut pas participation."], "church_su": ["Ce rendez-vous du dimanche est proposé pour préparer la semaine avec ton assemblée. Les jours et horaires doivent correspondre à ceux de ton église ; la participation à distance reste une règle à valider.", "Confirme après la participation. Aucune géolocalisation ni preuve photographique n’est demandée."]}, "en": {"wake": ["Get up at your chosen time. Review your day and adapt it to your work, responsibilities or health needs.", "Confirm once you are up. A different time does not erase your progress."], "gratitude_am": ["Name one or more reasons for gratitude: a person, help received or an opportunity today. You may do this silently or in your own words.", "Confirm after expressing gratitude. Writing in a journal is optional."], "prayer_am": ["Set aside time for morning prayer. The full Amidah is the planned default. It is not reproduced here while the complete source and its presentation await verification. You may also pray in your own words.", "Confirm after actually praying. Opening a page or starting an audio is not completion."], "bible_am": ["Read a Bible passage and take time to understand it. Day 1 of Appendix 1 of the French source book points to Matthew 6:25-34. Consider a practical action for your day.", "Confirm your actual reading. Choose partly done if you have not finished what you intended."], "exercise": ["Plan 10 to 15 minutes of gentle exercise suited to your abilities. Adapt movements and duration when needed, following your personal health guidance.", "Record what you actually did. An adaptation is not a failure; no performance target is required."], "professional": ["Spend 30 minutes reading material useful to your work, studies or activity. You may keep one idea to apply in your next task.", "Confirm actual reading, or choose partly done."], "prayer_noon": ["Make room for midday prayer at your personal time. The full authorised Amidah remains to be integrated. You may pray in your own words.", "Confirm this prayer separately from morning and evening prayer."], "sermon": ["Set aside 30 minutes for a sermon of your choice. Listen carefully and reflect on its teaching. No sermon is presented as an official recommendation in this demo.", "Confirm what you actually listened to. Starting playback is not completion."], "reading": ["Spend 30 minutes reading a personal development book chosen with discernment. You may reflect on an idea and how to put it into practice. No additional title is required here.", "Record your actual reading, including partial completion if needed."], "bible_pm": ["Read the Bible in the evening using your chosen passage or the programme content once published. Reflect on the text and your day without comparison with others.", "Confirm after reading. This is separate from morning reading."], "gratitude_pm": ["Look back on your day and express gratitude for one or more concrete things. You may also acknowledge a difficulty honestly.", "Confirm after this reflection. No personal account is required."], "prayer_pm": ["Set aside time for evening prayer. The full Amidah is the planned default once its source and presentation are verified. You may also pray in your own words.", "Confirm after praying. This activity has its own completion."], "sleep": ["Prepare for your chosen bedtime, adapting it to your responsibilities and personal needs. This activity relies on your declaration, without sleep surveillance.", "Confirm once you have gone to bed; you may return to that date the next day in this demo."], "church_we": ["Wednesday is a suggested slot. Use your congregation’s actual schedule. The module aims for three weekly participations, with adaptations for individual situations.", "Confirm actual participation. If you cannot attend, record honestly and resume without a reset."], "church_fr": ["Friday is a suggested slot to replace with your congregation’s schedule. Prepare your availability and participate according to your circumstances.", "Confirm actual participation. Receiving an invitation does not count as attendance."], "church_su": ["Sunday is a suggested slot with your congregation. Days and times should match your church. The rule for remote participation still needs approval.", "Confirm after participating. No location tracking or photographic proof is requested."]}};
let lang='fr';const events=new Map();const $=id=>document.getElementById(id);function key(h){return $('date').value+':'+h.id}function state(h){return events.get(key(h))||{step:0,help:false}}function visible(){const d=new Date($('date').value+'T12:00:00Z');const day=d.getUTCDay()||7;return habits.filter(h=>h.days.includes(day)).sort((a,b)=>a.time.localeCompare(b.time))}function change(h,step,help){const s=state(h);events.set(key(h),{step:step===null?s.step:step,help:help||s.help});renderCards()}
function renderChallenge(){
 const panel=$('challenge');panel.replaceChildren();
 const title=document.createElement('h2');title.textContent=lang==='fr'?'Les 30 défis de l’annexe officielle':'30 challenges from the official appendix';
 const intro=document.createElement('p');intro.className='subtle';intro.textContent=lang==='fr'?'Ressource du livre « 30 jours pour mettre Dieu en premier ». Consulte un jour ci-dessous. Ce repère de 30 jours ne fixe pas la durée du mois gratuit et ne constitue pas encore le calendrier des six mois.':'Book resource: “30 days to put God first”. Browse a day below. These 30 days do not define the free-month duration or the complete six-month programme.';
 const label=document.createElement('label');label.htmlFor='challenge_day';label.textContent=lang==='fr'?'Choisir un défi du livre':'Choose a challenge from the book';
 const select=document.createElement('select');select.id='challenge_day';for(const c of officialChallenges){const opt=document.createElement('option');opt.value=String(c.day);opt.textContent=(lang==='fr'?'Jour ':'Day ')+c.day;select.append(opt)}select.value=String(challengeDay);select.onchange=()=>{challengeDay=Number(select.value);renderChallenge()};
 const c=officialChallenges[challengeDay-1];const text=document.createElement('blockquote');text.lang='fr';text.textContent=c.text;text.style.margin='20px 0';text.style.fontFamily='Georgia,serif';text.style.fontSize='20px';
 const source=document.createElement('p');source.className='subtle';source.textContent=(lang==='fr'?'Texte source français vérifié : annexe 1, jour ':'Verified French source text: Appendix 1, day ')+c.day+(lang==='fr'?', page imprimée ':', printed page ')+c.page+'. '+(lang==='fr'?'La sélection de ce texte ne vaut pas réalisation du défi.':'Browsing this text does not complete the challenge. English translation is pending review.');
 panel.append(title,intro,label,select,text,source);
 if(c.day===21){const note=document.createElement('p');note.className='notice';note.textContent=lang==='fr'?'Le texte du livre mentionne le jeûne. L’application ne prescrit ni ne programme automatiquement un jeûne. La lecture de cette source ne constitue pas une consigne personnalisée de jeûne.':'The book text mentions fasting. The application does not prescribe or automatically schedule a fast. Reading this source is not a personalised fasting instruction.';panel.append(note)}
}

function renderCards(){const t=translations[lang],hs=visible(),n=hs.filter(h=>state(h).step===3).length;$('total').textContent=t.done(n,hs.length);$('progress').max=hs.length||1;$('progress').value=n;$('progress').setAttribute('aria-label',t.done(n,hs.length));renderChallenge();$('cards').replaceChildren();for(const h of hs){const s=state(h),card=document.createElement('article');card.className='habit'+(s.step===3?' done':'');const tm=document.createElement('span');tm.className='time';tm.textContent=h.time+' · '+$('timezone').value;const title=document.createElement('h3');title.textContent=h[lang];card.append(tm,title);const content=activityContent[lang][h.id];const badge=document.createElement('p');badge.className='subtle';badge.textContent=lang==='fr'?'Consigne proposée · à relire et valider':'Proposed guidance · pending review';const explanation=document.createElement('p');explanation.textContent=content[0];const criterion=document.createElement('p');criterion.className='subtle';criterion.textContent=(lang==='fr'?'Quand confirmer ? ':'When to confirm: ')+content[1];card.append(badge,explanation,criterion);if(h.min){const d=document.createElement('div');d.className='subtle';d.textContent=t.minutes(h.min,h.max);card.append(d)}const st=document.createElement('span');st.className='state';st.textContent=t.states[s.step];card.append(st);if(s.help){const help=document.createElement('span');help.className='help';help.textContent=t.helpState;card.append(help)}const actions=document.createElement('div');actions.className='actions';t.actions.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',label+' · '+h[lang]);b.setAttribute('aria-pressed',String(s.step===i+1));b.onclick=()=>change(h,i+1,false);actions.append(b)});const b=document.createElement('button');b.textContent=t.help;b.setAttribute('aria-label',t.help+' · '+h[lang]);b.setAttribute('aria-pressed',String(s.help));b.onclick=()=>change(h,null,true);actions.append(b);card.append(actions);$('cards').append(card)}}
function renderSchedules(){const t=translations[lang];$('schedules').replaceChildren();for(const h of habits){const row=document.createElement('div');row.className='schedule';const label=document.createElement('label');label.htmlFor='schedule_'+h.id;label.textContent=h[lang];const detail=document.createElement('small');detail.textContent=h.days.length===7?(lang==='fr'?'Chaque jour':'Every day'):h.days.map(d=>t.days[d-1]).join(', ');label.append(detail);const input=document.createElement('input');input.type='time';input.required=true;input.id='schedule_'+h.id;input.value=h.time;row.append(label,input);$('schedules').append(row)}}
function render(){const t=translations[lang];document.documentElement.lang=lang;for(const id of ['banner','kicker','heading','intro','access','today','settings','dateLabel','meaning','prayerTitle','prayerInfo','otherTitle','otherInfo','prefTitle','prefIntro','zoneLabel','church','apply','reset','footer'])$(id).textContent=t[id];$('status').textContent='';$('prayerSource').textContent=lang==='fr'?'Consulter le document source de l’Amidah':'Open the Amidah source document';$('prayerSourceNote').textContent=lang==='fr'?'Document français fourni, consultable depuis ton compte ChatGPT. La phonétique complète et l’audio ne sont pas disponibles dans cette démonstration. Le texte source contient des indications de saisons, fêtes et prières collectives : aucune sélection automatique n’est faite ici.':'French source provided, accessible from your ChatGPT account. Full phonetics and audio are not available in this demo. Seasonal, festival and congregational instructions are preserved in the source; no automatic selection is made here.';renderCards();renderSchedules()}
$('language').onchange=e=>{lang=e.target.value;render()};$('date').onchange=()=>{if(!$('date').value)$('date').value='2026-10-25';renderCards()};function page(p){$('day').hidden=p!=='today';$('preferences').hidden=p==='today';$('today').setAttribute('aria-pressed',String(p==='today'));$('settings').setAttribute('aria-pressed',String(p!=='today'));$('status').textContent=''}$('today').onclick=()=>page('today');$('settings').onclick=()=>page('settings');$('apply').onclick=()=>{for(const h of habits){const input=$('schedule_'+h.id);if(!input.reportValidity())return}for(const h of habits)h.time=$('schedule_'+h.id).value;renderCards();page('today');$('status').textContent=translations[lang].applied};$('reset').onclick=()=>{for(const h of habits)h.time=h.initial;renderSchedules();renderCards()};render();
</script></html>
