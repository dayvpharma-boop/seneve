<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SÉNEVÉ · Habitudes & Défis · Démonstration</title>
<style>
:root{color-scheme:light;--ink:#203f35;--gold:#a47927;--paper:#f6f2e8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid #becabe;background:white;border-radius:12px;padding:9px 14px;color:var(--ink)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a47927;outline-offset:3px}button[aria-pressed=true],.primary{background:var(--ink);color:white}header,main{max-width:940px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{letter-spacing:.18em;font-weight:750}.banner{background:#e9dec3;padding:12px 24px;text-align:center;color:#4a391b;font-size:14px}.eyebrow{letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:#6c734f}h1{font:normal clamp(30px,6vw,46px)/1.15 Georgia,serif;margin:10px 0}h2{font:normal 27px Georgia,serif}p{margin:8px 0 16px}.hero{background:var(--ink);color:#faf6ea;border-radius:24px;padding:28px}.hero .eyebrow{color:#ddc995}.hero p{max-width:620px}nav{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.summary{margin:24px 0;padding:18px;border:1px solid #d7d8c8;border-radius:16px}progress{width:100%;accent-color:var(--ink);height:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.habit{background:#fffdf7;padding:20px;border:1px solid #dce0d3;border-radius:18px}.habit.done{border-color:#769d83;background:#edf3e9}.habit h3{margin:5px 0;font:normal 23px Georgia,serif}.time{font-size:13px;color:#65745c}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.actions button{font-size:13px;padding:7px 10px}.state{display:block;font-size:14px;margin-top:12px}.help{font-size:13px;color:#7c5c21}.schedule{display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;padding:12px 0;border-bottom:1px solid #d7d8c8}input[type=time]{padding:9px;border:1px solid #bac7ba;border-radius:10px;background:#fff;max-width:130px}.schedule small{display:block;color:#63735e}.panel{background:#fffdf7;border:1px solid #dce0d3;border-radius:20px;padding:24px}.subtle{color:#627160;font-size:14px}.notice{border-left:3px solid var(--gold);padding:8px 16px;margin-top:18px}footer{padding:28px;text-align:center;font-size:13px;color:#65745c}[hidden]{display:none!important}select{padding:9px;background:white;border:1px solid #b6c4b6;border-radius:10px}#status{min-height:25px}.date{margin-top:20px}label{display:block} @media(max-width:620px){header,main{padding:18px}.cards{grid-template-columns:1fr}.hero{padding:23px}nav button{flex:1}.schedule{gap:7px}.actions button{flex:1}.top{flex-wrap:wrap}}
</style>
<div class="banner" id="banner"></div><header class="top"><span class="brand">SÉNEVÉ</span><select id="language" aria-label="Langue / Language"><option value="fr">Français</option><option value="en">English</option></select></header>
<main><section class="hero"><div class="eyebrow" id="kicker"></div><h1 id="heading"></h1><p id="intro"></p><span id="access"></span></section><nav aria-label="Module"><button id="today" aria-pressed="true"></button><button id="settings" aria-pressed="false"></button></nav><div id="status" role="status" aria-live="polite"></div><section id="day"><div class="date"><label id="dateLabel" for="date"></label><input type="date" id="date" value="2026-10-25"></div><div class="summary"><strong id="total"></strong><progress id="progress" value="0" max="1"></progress><div class="subtle" id="meaning"></div></div><div class="cards" id="cards"></div><aside class="notice"><h2 id="prayerTitle"></h2><p id="prayerInfo"></p></aside><aside class="notice"><h2 id="otherTitle"></h2><p id="otherInfo"></p></aside></section><section id="preferences" hidden class="panel"><h2 id="prefTitle"></h2><p id="prefIntro"></p><label for="timezone" id="zoneLabel"></label><select id="timezone"><option>Africa/Kinshasa</option><option>Africa/Lubumbashi</option><option>Europe/Paris</option><option>America/Montreal</option></select><div id="schedules"></div><p class="subtle" id="church"></p><button class="primary" id="apply"></button><button id="reset"></button></section></main><footer id="footer"></footer>
<script>
const translations={fr:{banner:'Démonstration · données fictives · aucun compte ni paiement',kicker:'Habitudes & Défis',heading:'Un petit pas, chaque jour.',intro:'Organise ta journée, pratique à ton rythme et reprends avec confiance.',access:'Parcours prévu : six mois · premier mois gratuit · cinq mois payants',today:'Mon aujourd’hui',settings:'Mes horaires',dateLabel:'Journée de démonstration',meaning:'Ce suivi montre les activités déclarées. Il ne mesure ni ta foi ni ta valeur.',prayerTitle:'Prier avec l’Amidah complète',prayerInfo:'La prière intégrale est prévue le matin, à midi et le soir. Son texte, ses langues et son audio seront proposés après validation. Aucun texte de remplacement n’est présenté ici.',otherTitle:'La suite du parcours',otherInfo:'Défis des sept racines, bilans, engagements privés et simulateur de dîme font aussi partie du module. Ils restent à préparer ; aucun montant ni récit intime n’est recueilli dans cette démonstration.',prefTitle:'Une journée adaptée à ta vie',prefIntro:'Modifie les heures proposées pour cette démonstration. Les habitudes restent distinctes et leurs réalisations sont conservées.',zoneLabel:'Fuseau horaire proposé',church:'Les créneaux de culte sont proposés : mercredi, vendredi et dimanche. Le choix des jours de ton assemblée sera ajouté lors de l’intégration.',apply:'Appliquer à la démonstration',reset:'Rétablir les horaires proposés',footer:'Prototype de travail · modifications conservées uniquement dans cette page ouverte · aucun rappel envoyé',states:['Non commencée','Préparée','Partiellement réalisée','Réalisée'],actions:['Préparer','En partie','J’ai réalisé'],help:'Besoin d’aide',helpState:'Aide demandée dans la démonstration',applied:'Horaires appliqués à la démonstration. Rien n’a été envoyé au serveur.',done:(n,t)=>n+' activité'+(n>1?'s':'')+' réalisée'+(n>1?'s':'')+' sur '+t,minutes:(a,b)=>a===b?a+' minutes':a+' à '+b+' minutes',days:['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche']},en:{banner:'Demo · fictional data · no account or payment',kicker:'Habits & Challenges',heading:'One small step, every day.',intro:'Plan your day, practise at your own pace and start again with confidence.',access:'Planned journey: six months · first month free · five paid months',today:'My today',settings:'My schedule',dateLabel:'Demonstration day',meaning:'This summary shows declared activities. It measures neither your faith nor your worth.',prayerTitle:'Pray with the complete Amidah',prayerInfo:'The full prayer is planned for morning, midday and evening. Its text, languages and audio will be offered after approval. No substitute text is shown here.',otherTitle:'The rest of the journey',otherInfo:'Seven-root challenges, reviews, private commitments and a tithe simulator are also part of this module. They are still being prepared; this demo collects no amounts or intimate accounts.',prefTitle:'A day that fits your life',prefIntro:'Change the suggested times in this demo. Each habit stays separate and its recorded completion is preserved.',zoneLabel:'Suggested time zone',church:'Church times are examples: Wednesday, Friday and Sunday. Choosing your congregation’s days will be added during integration.',apply:'Apply to the demo',reset:'Restore suggested times',footer:'Working prototype · changes remain only in this open page · no reminders are sent',states:['Not started','Prepared','Partly completed','Completed'],actions:['Prepare','Partly done','I completed it'],help:'Ask for help',helpState:'Help requested in the demo',applied:'Schedule applied to the demo. Nothing was sent to a server.',done:(n,t)=>n+' of '+t+' activities completed',minutes:(a,b)=>a===b?a+' minutes':a+' to '+b+' minutes',days:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']}};
const daily=[1,2,3,4,5,6,7];
const habits=[
['wake','05:45','Réveil','Wake up'],['gratitude_am','05:50','Gratitude du matin','Morning gratitude'],['prayer_am','06:00','Prière du matin','Morning prayer'],['bible_am','06:20','Bible du matin','Morning Bible reading'],['exercise','06:45','Exercice adapté','Adapted exercise',10,15],['professional','12:30','Lecture professionnelle','Professional reading',30,30],['prayer_noon','13:10','Prière de midi','Midday prayer'],['sermon','18:00','Écoute d’une prédication','Listen to a sermon',30,30],['reading','20:00','Développement personnel','Personal development reading',30,30],['bible_pm','20:35','Bible du soir','Evening Bible reading'],['gratitude_pm','21:00','Gratitude du soir','Evening gratitude'],['prayer_pm','21:10','Prière du soir','Evening prayer'],['sleep','22:00','Coucher','Bedtime'],['church_we','18:30','Culte du mercredi','Wednesday worship',null,null,[3]],['church_fr','18:30','Culte du vendredi','Friday worship',null,null,[5]],['church_su','09:00','Culte du dimanche','Sunday worship',null,null,[7]]].map(([id,time,fr,en,min,max,days])=>({id,time,initial:time,fr,en,min,max,days:days||daily}));
let lang='fr';const events=new Map();const $=id=>document.getElementById(id);function key(h){return $('date').value+':'+h.id}function state(h){return events.get(key(h))||{step:0,help:false}}function visible(){const d=new Date($('date').value+'T12:00:00Z');const day=d.getUTCDay()||7;return habits.filter(h=>h.days.includes(day)).sort((a,b)=>a.time.localeCompare(b.time))}function change(h,step,help){const s=state(h);events.set(key(h),{step:step===null?s.step:step,help:help||s.help});renderCards()}
function renderCards(){const t=translations[lang],hs=visible(),n=hs.filter(h=>state(h).step===3).length;$('total').textContent=t.done(n,hs.length);$('progress').max=hs.length||1;$('progress').value=n;$('progress').setAttribute('aria-label',t.done(n,hs.length));$('cards').replaceChildren();for(const h of hs){const s=state(h),card=document.createElement('article');card.className='habit'+(s.step===3?' done':'');const tm=document.createElement('span');tm.className='time';tm.textContent=h.time+' · '+$('timezone').value;const title=document.createElement('h3');title.textContent=h[lang];card.append(tm,title);if(h.min){const d=document.createElement('div');d.className='subtle';d.textContent=t.minutes(h.min,h.max);card.append(d)}const st=document.createElement('span');st.className='state';st.textContent=t.states[s.step];card.append(st);if(s.help){const help=document.createElement('span');help.className='help';help.textContent=t.helpState;card.append(help)}const actions=document.createElement('div');actions.className='actions';t.actions.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label',label+' · '+h[lang]);b.setAttribute('aria-pressed',String(s.step===i+1));b.onclick=()=>change(h,i+1,false);actions.append(b)});const b=document.createElement('button');b.textContent=t.help;b.setAttribute('aria-label',t.help+' · '+h[lang]);b.setAttribute('aria-pressed',String(s.help));b.onclick=()=>change(h,null,true);actions.append(b);card.append(actions);$('cards').append(card)}}
function renderSchedules(){const t=translations[lang];$('schedules').replaceChildren();for(const h of habits){const row=document.createElement('div');row.className='schedule';const label=document.createElement('label');label.htmlFor='schedule_'+h.id;label.textContent=h[lang];const detail=document.createElement('small');detail.textContent=h.days.length===7?(lang==='fr'?'Chaque jour':'Every day'):h.days.map(d=>t.days[d-1]).join(', ');label.append(detail);const input=document.createElement('input');input.type='time';input.required=true;input.id='schedule_'+h.id;input.value=h.time;row.append(label,input);$('schedules').append(row)}}
function render(){const t=translations[lang];document.documentElement.lang=lang;for(const id of ['banner','kicker','heading','intro','access','today','settings','dateLabel','meaning','prayerTitle','prayerInfo','otherTitle','otherInfo','prefTitle','prefIntro','zoneLabel','church','apply','reset','footer'])$(id).textContent=t[id];$('status').textContent='';renderCards();renderSchedules()}
$('language').onchange=e=>{lang=e.target.value;render()};$('date').onchange=()=>{if(!$('date').value)$('date').value='2026-10-25';renderCards()};function page(p){$('day').hidden=p!=='today';$('preferences').hidden=p==='today';$('today').setAttribute('aria-pressed',String(p==='today'));$('settings').setAttribute('aria-pressed',String(p!=='today'));$('status').textContent=''}$('today').onclick=()=>page('today');$('settings').onclick=()=>page('settings');$('apply').onclick=()=>{for(const h of habits){const input=$('schedule_'+h.id);if(!input.reportValidity())return}for(const h of habits)h.time=$('schedule_'+h.id).value;renderCards();page('today');$('status').textContent=translations[lang].applied};$('reset').onclick=()=>{for(const h of habits)h.time=h.initial;renderSchedules();renderCards()};render();
</script></html>
